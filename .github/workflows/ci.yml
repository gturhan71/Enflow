name: CI

# Faz C / S-08 (docs/OLCEKLENDIRME_DUZELTME_PLANI.md) — tsc/no-mock/tenant-scope/
# no-console guard'ları + backend vitest unit + frontend build tek komutta:
# kök `pnpm verify` script'i (package.json). RBAC Playwright süiti (P0-4) artık
# deterministik fixture (`pnpm seed:rbac`: 20 rol + ikinci tenant + lisanslar) ile
# taze SQLite DB'de koşar — `rbac-api` (hızlı) ve `rbac-ui` (~15 dk) ayrı job'lar.
# Aynı script yerelde: scripts/ci-rbac.sh api|ui|all

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (kök)
        run: pnpm install --frozen-lockfile

      - name: Install (backend)
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Prisma client üret
        working-directory: backend
        run: npx prisma generate

      - name: Doğrula (tsc kök+backend, guard'lar, vitest unit, build)
        run: pnpm verify

  # ADR-002 (B5) — Postgres uçtan uca: migration'lar → şema drift → RLS uygula +
  # doğrula → derlenmiş backend runtime rolüyle → setup/login/yaz-oku (uygulama RLS
  # yolu) → SIGTERM temiz kapanış. Aynı script yerelde: scripts/ci-postgres.sh
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (backend)
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Postgres uçtan uca doğrulama
        run: ./scripts/ci-postgres.sh

  rbac-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (kök + backend + rbac)
        run: |
          pnpm install --frozen-lockfile
          (cd backend && pnpm install --frozen-lockfile)
          (cd tests/rbac && pnpm install --frozen-lockfile)
      - name: Frontend build (backend aynı origin'den sunar)
        run: pnpm build
      - name: RBAC API + tenant izolasyonu
        run: ./scripts/ci-rbac.sh api

  rbac-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (kök + backend + rbac)
        run: |
          pnpm install --frozen-lockfile
          (cd backend && pnpm install --frozen-lockfile)
          (cd tests/rbac && pnpm install --frozen-lockfile)
      - name: Playwright Chromium
        working-directory: tests/rbac
        run: npx playwright install --with-deps chromium
      - name: Frontend build
        run: pnpm build
      - name: RBAC UI erişim matrisi
        run: ./scripts/ci-rbac.sh ui
      - name: Rapor
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rbac-ui-report
          path: tests/rbac/playwright-report
